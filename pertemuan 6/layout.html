<!DOCTYPE html>
<html>
<head>
<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
}

/* Header */
.header {
  background-color: #4CAF50;
  padding: 20px;
  text-align: center;
  color: white;
}

/* Container baris */
.row {
  display: flex;
}

/* Kolom */
.column {
  flex: 33.33%;
  padding: 20px;
  height: 200px;
  border: 2px solid white;
  color: white;
  text-align: center;
  font-size: 20px;
}

/* Warna tiap box */
.col1 { background-color: #2196F3; }
.col2 { background-color: #f44336; }
.col3 { background-color: #ff9800; }

.col4 { background-color: #9c27b0; }
.col5 { background-color: #009688; }
.col6 { background-color: #795548; }

/* Footer */
.footer {
  background-color: #333;
  padding: 15px;
  text-align: center;
  color: white;
}

</style>
</head>

<body>

<div class="header">
  <h1>HEADER</h1>
</div>

<!-- Baris Pertama -->
<div class="row">
  <div class="column col1">Sidebar Kiri</div>
  <div class="column col2">Content Utama</div>
  <div class="column col3">Sidebar Kanan</div>
</div>

<!-- Baris Kedua -->
<div class="row">
  <div class="column col4">Gallery</div>
  <div class="column col5">Artikel</div>
  <div class="column col6">Informasi</div>
</div>

<div class="footer">
  <h3>FOOTER</h3>
</div>

</body>
</html>
