<!DOCTYPE html>
<html>
<head>
    <title>Layout CSS 3 Kolom 2 Baris</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Header */
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 30px;
            font-size: 30px;
        }

        /* Kolom */
        .column {
            float: left;
            padding: 20px;
            height: 250px;
        }

        /* 3 kolom */
        .left {
            width: 25%;
            background-color: #f4cccc;
        }

        .middle {
            width: 50%;
            background-color: #c9daf8;
        }

        .right {
            width: 25%;
            background-color: #d9ead3;
        }

        /* Clear float */
        .row:after {
            content: "";
            display: table;
            clear: both;
        }

        /* Footer */
        .footer {
            background-color: #333;
            color: white;
            padding: 20px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>HEADER</h1>
    </div>

    <!-- 3 Kolom -->
    <div class="row">

        <div class="column left">
            <h2>SIDEBAR KIRI</h2>
            <p>Berisi menu navigasi.</p>
        </div>

        <div class="column middle">
            <h2>CONTENT</h2>
            <p>Berisi isi utama website.</p>
        </div>

        <div class="column right">
            <h2>SIDEBAR KANAN</h2>
            <p>Berisi informasi tambahan.</p>
        </div>

    </div>

    <!-- Footer -->
    <div class="footer">
        <h2>FOOTER</h2>
    </div>

</body>
</html>
